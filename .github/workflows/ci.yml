name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: [".github/workflows/fetch-data.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the latest database (for the rule-citation check)
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin data 2>/dev/null; then
            parts=$(git ls-tree --name-only origin/data | grep -E '^judge\.db\.xz(\.part[0-9]+)?$' | sort || true)
            if [ -n "$parts" ]; then
              for p in $parts; do git show "origin/data:$p"; done > "$RUNNER_TEMP/judge.db.xz"
              xz -d "$RUNNER_TEMP/judge.db.xz"
              echo "MTG_JUDGE_DB=$RUNNER_TEMP/judge.db" >> "$GITHUB_ENV"
              # The raw rules text too: the citation tests parse it with this revision's parser, so a database
              # built by another revision (the daily build runs from main) can't fail a correct citation.
              if git ls-tree --name-only origin/data | grep -qx 'MagicCompRules.txt'; then
                git show origin/data:MagicCompRules.txt > "$RUNNER_TEMP/MagicCompRules.txt"
                echo "MTG_JUDGE_CR_TEXT=$RUNNER_TEMP/MagicCompRules.txt" >> "$GITHUB_ENV"
              fi
            fi
          fi
      - run: ./gradlew test --no-daemon
